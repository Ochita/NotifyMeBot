telegram_bot_token: "your-telegram-bot-token"
# Mirror if this host is blocked: https://ru-api.aitunnel.ru/v1
base_url: "https://api.aitunnel.ru/v1"
api_key: "sk-aitunnel-your-key"

# gpt-4.1-nano: strict JSON schema, no reasoning-token tax.
model_name: "gpt-4.1-nano"
# Speech-to-text model for voice messages.
stt_model: "voxtral-small-24b-2507-stt"

# App behavior
default_timezone: "UTC"
default_locale: "en"
database_path: "notifyme.sqlite3"
# When false, only Telegram user_ids already present in the users table may use the bot.
allow_new_users: true
